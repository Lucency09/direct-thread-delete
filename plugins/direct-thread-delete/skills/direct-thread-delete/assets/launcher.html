<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>打开 Codex 会话管理器</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; place-items: center; min-height: 100vh; margin: 0; color: #172027; background: radial-gradient(circle at 20% 0%, #dff4ec, transparent 32rem), #f3f5f2; }
    main { width: min(520px, calc(100vw - 32px)); padding: 34px; border: 1px solid #dfe3de; border-radius: 24px; background: rgba(255,255,255,.94); box-shadow: 0 24px 70px rgba(28,44,52,.13); }
    p { color: #68727d; line-height: 1.65; }
    a { display: inline-flex; margin-top: 8px; padding: 12px 18px; border-radius: 12px; color: #fff; background: #187c62; font-weight: 800; text-decoration: none; }
    a:hover { background: #0f5e49; }
  </style>
</head>
<body>
  <main>
    <h1>打开会话管理器</h1>
    <p>启动页只用于创建一个可由“关闭管理器”按钮正常关闭的管理标签。</p>
    <a id="openManager" href="/" target="_blank">打开会话管理器</a>
  </main>
</body>
</html>
